[project]
name = "dahu-image"
version = "0.1.0"
description = "图片处理与 PDF 转换"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.4",
    "img2pdf>=0.5.1",
    "pillow-heif>=0.18",
]

[project.scripts]
dahu-image = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 新增功能包时把包名加到这里。不要改成自动扫描，仓库里的 venv 会被扫进去。
[tool.setuptools]
py-modules = ["main", "version"]
packages = [
    "shared",
    "shared.domain",
    "shared.presentation",
    "shared.presentation.widgets",
    "shared.presentation.shell",
    "features",
    "features.image_to_pdf",
]
